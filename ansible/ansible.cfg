# =============================================================================
# ansible.cfg — Ansible configuration for the lab
# =============================================================================
# Always invoke Ansible through the Makefile in the repository root (e.g.
# "make verify"). The Makefile sets ANSIBLE_SSH_ARGS so that every connection
# uses the generated .ssh-config: bastion directly, cluster nodes via ProxyJump.
# =============================================================================

[defaults]
inventory              = inventory/hosts.yml
roles_path             = roles
interpreter_python     = auto_silent
callback_result_format = yaml
retry_files_enabled    = False

# Lab simplification: VMs are recreated often and get new host keys each time.
# Tracked as a known risk (docs/architecture.md, R-05).
host_key_checking      = False

[ssh_connection]
pipelining = True
