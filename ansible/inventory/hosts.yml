# =============================================================================
# hosts.yml — lab topology (single source of truth, ADR-0010)
# =============================================================================
# This file is read by TWO tools:
#   - Ansible: as its inventory
#   - Vagrant: the Vagrantfile creates the VMs from exactly these entries
# Adding a node or changing an IP happens here and nowhere else.
#
# Per-host variables:
#   airgap_ip    address on the isolated "airgap" network (VirtualBox intnet)
#   transfer_ip  address on the host-only network = data diode to the Mac
#                (bastion only)
#   vm_cpus      vCPUs of the VM
#   vm_memory    RAM of the VM in MB
#
# SSH access always goes through the generated .ssh-config (make ssh-config),
# which is why no ansible_host is set here.
# =============================================================================

all:
  vars:
    ansible_user: vagrant
    lab_domain: lab.internal
    airgap_network: 10.20.0.0/24
    transfer_network: 192.168.56.0/24

  children:
    bastion:
      hosts:
        infra:
          airgap_ip: 10.20.0.10
          transfer_ip: 192.168.56.10
          vm_cpus: 2
          vm_memory: 4096

    control_plane:
      hosts:
        cp1:
          airgap_ip: 10.20.0.11
          vm_cpus: 2
          vm_memory: 4096

    workers:
      hosts:
        w1:
          airgap_ip: 10.20.0.21
          vm_cpus: 2
          vm_memory: 4096
        w2:
          airgap_ip: 10.20.0.22
          vm_cpus: 2
          vm_memory: 4096

    k8s_cluster:
      children:
        control_plane:
        workers:
